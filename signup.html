<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign Up | GripCore</title>

  <link rel="stylesheet" href="signup.css" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- =========================================
       TOP CONTROLS
  ========================================== -->

  <div class="auth-controls">

    <button
      type="button"
      id="themeToggle"
      class="control-btn"
      aria-label="Toggle dark mode"
    >
      <i data-lucide="moon"></i>
    </button>

    <button
      type="button"
      id="rtlToggle"
      class="control-btn"
      aria-label="Toggle RTL"
    >
    <!-- <i data-lucide="refresh-cw"></i> -->

    <i class="fa-solid fa-exchange"></i>
    </button>

  </div>


  <!-- =========================================
       SIGNUP PAGE
  ========================================== -->

  <main class="signup-page">

    <div class="signup-card">

      <!-- LOGO -->

      <div class="signup-logo" onclick="document.location='index.html'">
  <img
    id="pageLogo"
    src="images/logo-light.png"
    alt="GripCore"
  />
</div>

      <!-- HEADER -->

      <div class="signup-header">

        <span class="signup-tag">
          CREATE YOUR ACCOUNT
        </span>

        <h1>
          Join <span>GripCore.</span>
        </h1>

        <p>
          Create your account and manage your appointments,
          services, and vehicle care with ease.
        </p>

      </div>


      <!-- FORM -->

      <form id="signupForm" class="signup-form">

        <!-- FIRST + LAST NAME -->

        <div class="form-row">

          <div class="form-group">

            <label for="firstName">
              First Name
            </label>

            <div class="input-box">

              <i data-lucide="user"></i>

              <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter first name"
                required
              />

            </div>

          </div>


          <div class="form-group">

            <label for="lastName">
              Last Name
            </label>

            <div class="input-box">

              <i data-lucide="user"></i>

              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter last name"
                required
              />

            </div>

          </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-box">

            <i data-lucide="mail"></i>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />

          </div>

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <div class="input-box">

            <i data-lucide="phone"></i>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter phone number"
              required
            />

          </div>

        </div>


        <!-- PASSWORD + CONFIRM PASSWORD -->

        <div class="form-row">

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="input-box">

              <i data-lucide="lock"></i>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                data-target="password"
              >
                <i data-lucide="eye"></i>
              </button>

            </div>

          </div>


          <div class="form-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <div class="input-box">

              <i data-lucide="lock"></i>

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                data-target="confirmPassword"
              >
                <i data-lucide="eye"></i>
              </button>

            </div>

          </div>

        </div>


        <!-- TERMS -->

        <div class="terms-row">

          <label class="checkbox-label">

            <input
              type="checkbox"
              id="terms"
              required
            />

            <span class="custom-checkbox"></span>

            <span>
              I agree to the
              <a href="#">Terms</a>
              &
              <a href="#">Privacy Policy</a>
            </span>

          </label>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="signup-submit"
        >

          Create Account

          <i data-lucide="arrow-up-right"></i>

        </button>


        <!-- DIVIDER -->

        <div class="auth-divider">

          <span></span>

          <p>OR CONTINUE WITH</p>

          <span></span>

        </div>


        <!-- SOCIAL -->

        <div class="social-buttons">

          <button type="button" class="social-btn">
            <i class="fa-brands fa-google"></i>
            Google
          </button>

          <button type="button" class="social-btn">
            <i class="fa-brands fa-apple"></i>
            Apple
          </button>

        </div>


        <!-- LOGIN LINK -->

        <p class="login-link">

          Already have an account?

          <a href="login.html">
            Login
          </a>

        </p>

      </form>

    </div>

  </main>


  <!-- JAVASCRIPT -->

  <script src="signup.js"></script>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
