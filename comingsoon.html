<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="184x184"
      href="images/logo-light.png"
    />

    <title>Coming Soon | GripCore</title>

    <link rel="icon" href="images/logo-light.png" />

    <link rel="stylesheet" href="comingsoon.css" />


    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>

    <div class="page-controls">

      <button
        id="darkModeToggle"
        class="control-btn"
        type="button"
        title="Dark Mode"
      >
        <i class="fa-solid fa-moon"></i>
      </button>


      <button id="rtlToggle" class="control-btn" type="button" title="RTL Mode">
        <i class="fa-solid fa-right-left"></i>;
      </button>
    </div>


    <main class="coming-soon-page">
      <section class="coming-soon-card">


        <div class="coming-logo" id="comingLogoLink">
          <img
            id="comingLogo"
            src="images/logo-light.png"
            alt="GripCore Logo"
          />
        </div>


        <div class="coming-icon">
          <i class="fa-solid fa-rocket"></i>
        </div>


        <span class="coming-label"> GRIPCORE </span>


        <h1>Coming Soon</h1>


        <h2>Something Powerful Is On The Way</h2>


        <p class="coming-description">
          We're working on something special for your driving experience. Stay
          tuned for exciting updates and fresh automotive content.
        </p>

        <div class="countdown">

          <div class="countdown-box">
            <strong id="days"> 29 </strong>

            <span> DAYS </span>
          </div>

          <div class="countdown-separator">:</div>


          <div class="countdown-box">
            <strong id="hours"> 23 </strong>

            <span> HOURS </span>
          </div>

          <div class="countdown-separator">:</div>


          <div class="countdown-box">
            <strong id="minutes"> 59 </strong>

            <span> MINS </span>
          </div>

          <div class="countdown-separator">:</div>

          <div class="countdown-box">
            <strong id="seconds"> 45 </strong>

            <span> SECS </span>
          </div>
        </div>


        <form class="notify-form" id="notifyForm">
          <div class="email-wrapper">
            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="notifyEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="notify-btn">
            <i class="fa-regular fa-paper-plane"></i>

            Notify Me
          </button>
        </form>


        <p class="notify-message" id="notifyMessage"></p>

        <a href="index.html" class="home-btn">
          <i class="fa-solid fa-arrow-left"></i>

          Back To Home
        </a>
      </section>
    </main>


    <script src="comingsoon.js" defer></script>
  </body>
</html>
